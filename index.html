<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lorebook Lab</title>
<meta name="description" content="Zeta・Zetter向けロアブックのキーワード一致・誤発火・拾い漏れを、ブラウザ内だけで検証するツール">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <path d="M11 3h6M12 3v7.5L5.6 21.4A2.4 2.4 0 0 0 7.7 25h12.6a2.4 2.4 0 0 0 2.1-3.6L16 10.5V3" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8.2 18h11.6l2 3.6a1.4 1.4 0 0 1-1.2 2.1H7.4a1.4 1.4 0 0 1-1.2-2.1Z" fill="var(--mark)"/>
        <circle cx="12" cy="21" r="1.1" fill="var(--accent)"/><circle cx="16.5" cy="20" r="0.8" fill="var(--accent)"/>
      </svg>
      <div>
        <div class="brand-name">Lorebook Lab</div>
        <div class="brand-sub">ロアブック検証ラボ</div>
      </div>
    </div>
    <label class="lb-picker">
      <span class="sr-only">使うロアブック</span>
      <select id="active-lb"></select>
    </label>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabbar" aria-label="画面の切り替え">
  <div class="tabbar-inner" role="tablist">
    <button class="tab" role="tab" data-tab="sim" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M4 11h7M4 16h9"/><path d="M15 13.5h5.5v3.5H15z" fill="currentColor" opacity=".25"/><circle cx="17" cy="9" r="3"/><path d="m19.2 11.2 2 2"/></svg>
      照合
    </button>
    <button class="tab" role="tab" data-tab="audit" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m8.5 10 1.5 1.5L13 8.5"/><path d="M8.5 16h7"/></svg>
      監査
    </button>
    <button class="tab" role="tab" data-tab="compare" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="7.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="7.5" height="14" rx="1.5"/><path d="M5.5 9h3M5.5 12h3M16 9h3M16 12h3M16 15h2"/></svg>
      比較
    </button>
    <button class="tab" role="tab" data-tab="chain" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M6 8.2v7.6M8 7l8 4M8 17l8-4"/></svg>
      連動
    </button>
    <button class="tab" role="tab" data-tab="manage" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6M9 11h4"/></svg>
      管理
    </button>
  </div>
</nav>

<script src="js/core/matcher.js"></script>
<script src="js/core/parser.js"></script>
<script src="js/core/audit.js"></script>
<script src="js/core/compare.js"></script>
<script src="js/core/chain.js"></script>
<script src="js/data/sample.js"></script>
<script src="js/app.js"></script>
</body>
</html>
